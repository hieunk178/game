<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style>
<script src="./three.min.js"></script><script src="./GLTFLoader.js"></script></head><body>
<script>
const W = 300, H = 300;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 500);

function makeScene() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0xf4f4f6);
  s.add(new THREE.AmbientLight(0xffffff, 0.95));
  const d = new THREE.DirectionalLight(0xffffff, 1.0); d.position.set(3, 6, 4); s.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.45); d2.position.set(-4, 2, -3); s.add(d2);
  return s;
}

// loads one .glb and returns { png: dataURL, stats }
window.shootPart = function (url, angle) {
  return new Promise((resolve, reject) => {
    new THREE.GLTFLoader().load(url, gltf => {
      const scene = makeScene();
      scene.add(gltf.scene);
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
      const r = Math.max(s.length() / 2, 0.02);
      const dist = r / Math.tan(Math.PI * 35 / 360) * 1.35;
      const a = angle === undefined ? 0.9 : angle;
      cam.position.set(c.x + dist * Math.cos(a) * 0.8, c.y + dist * 0.5, c.z + dist * Math.sin(a) * 0.8);
      cam.lookAt(c);
      cam.near = Math.max(dist / 500, 0.001); cam.far = dist * 20; cam.updateProjectionMatrix();
      renderer.render(scene, cam);
      const png = renderer.domElement.toDataURL('image/png');
      scene.remove(gltf.scene);
      resolve({ png, size: [s.x, s.y, s.z] });
    }, undefined, e => reject(new Error(url + ': ' + e)));
  });
};
window.READY = true;
</script></body></html>
